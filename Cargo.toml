[package]
name = "wrd-game"
version = "0.1.0"
edition = "2021"
publish = false # Хорошая практика для бинарных проектов

[dependencies]
# Основа нашего сервера
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] } 


tower-http = { version = "0.5", features = ["fs"] }

# Сериализация / Десериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP-клиент для внешних запросов
reqwest = { version = "0.12", features = ["json"] }

# Конфигурация и ошибки
dotenvy = "0.15"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


# --- НОВЫЕ ЗАВИСИМОСТИ ДЛЯ WS-СЕРВЕРА ---
# Утилиты для работы с асинхронными потоками (нужны для разделения сокета)
futures = "0.3"
# Конкурентная хэш-мапа для хранения игровых комнат
dashmap = "5.5"
# Генерация уникальных ID для игроков и комнат
uuid = { version = "1.6", features = ["v4", "serde"] }